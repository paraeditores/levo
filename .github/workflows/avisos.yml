name: Avisos Mini Esteban
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Aviso a mandar ya (prueba, manana, mediodia, tarde, cierre)"
        required: false
        default: "prueba"
permissions:
  contents: write
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/avisos.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORZAR: ${{ github.event.inputs.forzar }}
      - name: Latido semanal (para que GitHub no apague el cron)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "12" ]; then
            date -u > latido.txt
            git config user.name "mini-esteban-bot"; git config user.email "actions@users.noreply.github.com"
            git add latido.txt && git commit -m "Latido semanal" && git push
          fi
